# DivyaDrishti - authenticating reverse proxy
# ---------------------------------------------------------------------------
# The API itself is unauthenticated unless DF_API_KEY is set (every /v1
# endpoint then demands the shared secret; only /health stays open for
# liveness probes). This config is the reference "defense in depth" front
# door: TLS termination, upload-size ceiling, timeouts, and an optional
# gateway-level API-key check so that a leaked app-level key alone is not
# enough to reach the service from the open internet.
#
# Deploy:
#   nginx:  sudo cp deploy/nginx-divyadrishhti.conf /etc/nginx/sites-available/
#           sudo ln -s /etc/nginx/sites-available/nginx-divyadrishhti.conf \
#                        /etc/nginx/sites-enabled/
#           # put the real certificate paths in the ssl_certificate lines
#           sudo nginx -t && sudo systemctl reload nginx
#
#   uvicorn (behind it, loopback only):
#   DF_API_KEY=<secret> uvicorn api.server:app --host 127.0.0.1 --port 8000
# ---------------------------------------------------------------------------

server {
    listen 443 ssl http2;
    server_name deepfake.example.internal;

    # --- TLS: real certificates required in production ---------------------
    ssl_certificate     /etc/ssl/certs/divyadrishhti.crt;
    ssl_certificate_key /etc/ssl/private/divyadrishhti.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Must match DF_MAX_UPLOAD_BYTES (default 20 MB) plus multipart overhead.
    client_max_body_size 24m;

    # Reject unauthenticated traffic before it reaches the app. Comment this
    # block out only if the gateway's own identity layer (SSO/IAP/mTLS) is
    # doing the authentication instead.
    if ($http_x_api_key = "") {
        return 401;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Video scoring can take a while on CPU-bound workers.
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }
}

server {
    listen 80;
    server_name deepfake.example.internal;
    return 301 https://$host$request_uri;
}
